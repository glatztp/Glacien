<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo-p.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glacien — Componentes React</title>
    <meta
      name="description"
      content="A maior biblioteca de componentes React/TypeScript do Brasil. UI moderna, acessível, customizável e pronta para produção. Design system, dark mode, animações, performance e acessibilidade."
    />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <link rel="alternate" href="https://glacien.online/" hreflang="pt-br" />
    <link rel="alternate" href="https://glacien.online/" hreflang="x-default" />
    <meta
      name="keywords"
      content="react, componentes, ui, biblioteca, design system, typescript, acessibilidade, dark mode, animação, radix, tailwind, glacien, shadcn, enterprise, profissional"
    />
    <!-- Performance & fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/logo-p.png" />
    <link rel="canonical" href="https://glacien.online/" />
    <meta name="theme-color" content="#18181b" />
    <!-- Manifest and app install links removed to avoid automatic install prompts -->
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://glacien.online/" />
    <meta
      property="og:title"
      content="Glacien — Componentes React"
    />
    <meta
      property="og:description"
      content="A maior biblioteca de componentes React/TypeScript do Brasil. UI moderna, acessível, customizável e pronta para produção."
    />
    <meta property="og:image" content="https://glacien.online/logo-p.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Glacien UI — Componentes React"
    />
    <meta
      name="twitter:description"
      content="A maior biblioteca de componentes React/TypeScript do Brasil. UI moderna, acessível, customizável e pronta para produção."
    />
    <meta name="twitter:image" content="https://glacien.online/logo-p.png" />
    <meta name="twitter:site" content="@glatztp" />
    <!-- JSON-LD Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Glacien",
        "url": "https://glacien.online/",
        "logo": "https://glacien.online/logo-p.png",
        "sameAs": [
          "https://github.com/glatztp/glacien",
          "https://www.npmjs.com/package/@glacien/ui"
        ],
        "description": "A maior biblioteca de componentes React/TypeScript do Brasil. UI moderna, acessível, customizável e pronta para produção.",
        "contactPoint": [
          {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "areaServed": "BR",
            "availableLanguage": ["Portuguese", "English"]
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://glacien.online/",
        "name": "Glacien UI",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://glacien.online/?s={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
